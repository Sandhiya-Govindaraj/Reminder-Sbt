<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Reminder App</h1>
    <p class="login-subtitle">Sign in to manage your tasks</p>

    @if (error) {
      <div class="error-message">{{ error }}</div>
    }

    @if (!otpSent) {
      <form [formGroup]="loginForm" (ngSubmit)="sendOtp()">
        <div class="form-group">
          <label>Login with</label>
          <select formControlName="channel" (change)="onChannelChange()" class="form-control">
            <option value="EMAIL">Email</option>
            <option value="PHONE">Phone</option>
          </select>
        </div>

        @if (channel === 'EMAIL') {
          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              class="form-control"
            />
          </div>
        } @else {
          <div class="form-group">
            <label>Phone Number</label>
            <input
              type="tel"
              formControlName="phone"
              placeholder="Enter your phone number"
              class="form-control"
            />
          </div>
        }

        <div class="form-group">
          <label>Name (optional)</label>
          <input
            type="text"
            formControlName="name"
            placeholder="Enter your name"
            class="form-control"
          />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="loading">
          {{ loading ? 'Sending...' : 'Send OTP' }}
        </button>
      </form>
    } @else {
      <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
        <div class="form-group">
          <label>Enter OTP</label>
          <input
            type="text"
            formControlName="code"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            class="form-control otp-input"
          />
        </div>

        @if (devOtp) {
          <div class="dev-otp">
            Dev OTP: <strong>{{ devOtp }}</strong>
          </div>
        }

        <button type="submit" class="btn btn-primary" [disabled]="loading || otpForm.invalid">
          {{ loading ? 'Verifying...' : 'Verify OTP' }}
        </button>

        <button type="button" class="btn btn-secondary" (click)="resetForm()">
          Back
        </button>
      </form>
    }
  </div>
</div>
